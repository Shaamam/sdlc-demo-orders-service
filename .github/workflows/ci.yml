name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Spotless (google-java-format)
        run: ./mvnw -B spotless:check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests, architecture rules, coverage >= 80%
        run: ./mvnw -B verify -Dspotless.check.skip=true
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports
            target/site/jacoco
          if-no-files-found: ignore

  api-docs:
    name: api-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every endpoint is documented in docs/API.md
        run: python3 .github/scripts/check_api_docs.py
